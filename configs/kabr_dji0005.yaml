# Configuration for KABR DJI_0005 (2026-11-17 morning run — the shortest
# unrun video, added at Prateek's request ahead of the 10:00 AM review).
#
# Dataset: KABR (Kenya) DJI Air 2S flight, 2023-01-16. Video 3840x2160 @
# 29.97 fps, 16.6 s (~498 frames) HEVC + per-frame DJI .SRT sidecar (496 GPS
# records, ~30 Hz, altitude ~54 m). Path:
# ~/workspace/tbpp-data/more-videos/kabr-dji0005/ — see
# ~/workspace/tbpp-data/VIDEO_SOURCES.md.
#
# Focal (Phase 1 spec path): DJI Air 2S, 1-inch sensor (13.2 mm wide),
# 8.4 mm lens -> fx = 8.4/13.2 x 3840 = 2443.6 px. Do NOT trust the SRT
# focal_len field (224 = 22.4 mm, a 35mm-equivalent-style value that varies
# between flights). Principal point assumed centred (not measured).
#
# SRT format: bracketed ``longitude``/``altitude`` variant (the OTHER KABR
# variant vs DJI_0679's ``longtitude``/``rel_alt`` typo form) — both handled
# by uav3d/telemetry/srt_parser.py. SRT timestamps are already in the
# video-PTS basis (record 0 at t=0), so sync needs no offset.
# max_delta_us 50 ms: SRT fixes arrive per frame (~33 ms apart).
#
# Small run by design: max_frames 36 (not 120) to bound SfM wall time —
# DJI_0679's 120 frames took 71 min (SfM+sync) and BA cost grows
# superlinearly, so this run stays small. Full 16.6 s clip.
#
# Run:
#   python scripts/run_video_pipeline.py --video \
#     /home/hatch/workspace/tbpp-data/more-videos/kabr-dji0005/flight_1-DJI_0005.MP4 \
#     --config configs/kabr_dji0005.yaml \
#     --telemetry /home/hatch/workspace/tbpp-data/more-videos/kabr-dji0005/flight_1-DJI_0005.SRT \
#     --stage all --mesh --max-width 960 --ref-stride 2
# Dense only if the GPS-residual median is < 10 m (the gate decides).

data_dir: "./data"
dataset_label: "KABR DJI_0005 (DJI Air 2S, 4K + SRT) — morning run 2026-11-17"

source:
  type: "video"
  video_path: "/home/hatch/workspace/tbpp-data/more-videos/kabr-dji0005/flight_1-DJI_0005.MP4"
  count: 300
  stride: 1

keyframes:
  strategy: "laplacian_variance"
  stride: 1
  max_frames: 36
  min_blur: 40.0
  max_clipping: 0.65
  max_gap: 20
  orb_features: 2000

sfm:
  camera_model: "SIMPLE_PINHOLE"
  single_camera: true
  seq_overlap: 15
  max_image_size: 1600
  refine_intrinsics: false
  # DJI Air 2S spec: 8.4 mm lens, 1-inch sensor 13.2 mm wide ->
  # fx = 8.4/13.2 * 3840 = 2443.6 px. Provenance: spec (not measured).
  focal_mm: 8.4
  sensor_width_mm: 13.2
  feature_type: "SIFT"
  matcher_type: "sequential"
  min_num_matches: 20
  init_min_inliers: 20
  init_min_tri_angle: 3.0
  abs_pose_min_inliers: 12
  # Global-BA cadence 2.0 (not the 1.1 default): vegetation triangulates
  # >10% new points per frame, so the default runs a 3-4 min global BA
  # after EVERY frame (measured on DJI_0679: 51/120 in 26 min before the
  # run was stopped). 2.0 => BA when the model doubles + the final global
  # BA; local BA still runs per frame. See SfmConfig.
  ba_global_frames_ratio: 2.0
  ba_global_points_ratio: 2.0

sync:
  max_delta_us: 50000
  strategy: "nearest"

validation:
  alignment: "sim3"
  ate_threshold_meters: 5.0

dense:
  scale_source: "gnss"
  gnss_reject_k_mad: 5.0
