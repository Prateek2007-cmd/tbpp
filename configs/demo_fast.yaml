# Configuration for a single monocular video file (e.g. city_flyover).
#
# Use with:  python -m uav3d.cli keyframes --video /path/to/city_flyover.mp4 \
#                --config configs/video_flyover.yaml
# The --video flag takes precedence over source.video_path, so the file path can
# live on the command line and this config stays generic.
#
# Differences from zurich_baseline.yaml, and why:
#   * max_clipping is relaxed from 0.05 to 0.65. Aerial footage with sky in frame
#     routinely clips 30 %+ of pixels; the 5 % Zurich threshold rejects every
#     frame and the run dies at the quality gate.
#   * camera_model is SIMPLE_PINHOLE. Video carries no EXIF intrinsics and the
#     CLI pins one shared focal for video runs, because refining fx and fy
#     independently on forward flight produces a physically impossible aspect
#     ratio (measured 1.69 on synthetic footage).
#   * refine_intrinsics is FALSE for single-pass video. Free refinement is
#     unstable on forward flight: the Nov 16 focal experiment
#     (docs/HANDOFF_NEXT_SESSION.md §12) solved 447 px once and 492 px the
#     next run on identical synthetic data (true focal 265 px), while
#     reprojection error stayed ~0.28 px throughout — a straight strip is a
#     critical motion sequence, so focal trades against depth/scale and the
#     error is invisible to reproj. Lock the prior focal and get a real one
#     from calibration / EXIF / sensor spec instead (see Phase 1 of the plan
#     in ~/workspace/tbpp-audit/AUDIT_AND_PLAN.md). The focal-drift gate
#     (sfm/focal_gate.py) flags solved-vs-prior drift when refinement is on.
#   * min_blur is lowered: video compression softens frames compared with the
#     Zurich stills.

data_dir: "./data"
dataset_label: "replayed public dataset (monocular video, unverified scale)"

source:
  type: "video"
  # Overridden by --video on the command line.
  video_path: "data/city_flyover.mp4"
  count: 300
  stride: 1

keyframes:
  strategy: "laplacian_variance"
  stride: 1
  max_frames: 60
  min_blur: 40.0
  max_clipping: 0.65
  max_gap: 20
  orb_features: 2000

sfm:
  camera_model: "SIMPLE_PINHOLE"
  single_camera: true
  seq_overlap: 15
  max_image_size: 1600
  refine_intrinsics: false
  # --- Focal length (Phase 1). Without one of these the pipeline falls back
  # to the 0.8 * width guess, which on forward flight can stretch the whole
  # model while reprojection error stays low. Uncomment ONE path, best first:
  #   1. measured pre-flight calibration (best):  focal_px: 265.0
  #   2. still with the same settings:            exif_image: "data/still.jpg"
  #      (+ sensor dims below, unless the still's EXIF carries FocalPlane tags)
  #   3. spec sheet:  focal_mm: 12.29  +  sensor_format: "4/3"
  #      (formats: "4/3", "1-inch", "1/1.3-inch"; or sensor_width_mm /
  #      sensor_height_mm explicitly). NEVER the 35mm-equivalent focal.
  # focal_px: null
  # focal_mm: null
  # sensor_width_mm: null
  # sensor_height_mm: null
  # sensor_format: null
  # exif_image: null
  feature_type: "SIFT"
  matcher_type: "sequential"
  min_num_matches: 20
  init_min_inliers: 20
  init_min_tri_angle: 3.0
  abs_pose_min_inliers: 12

sync:
  max_delta_us: 50000
  strategy: "nearest"

validation:
  alignment: "sim3"
  ate_threshold_meters: 5.0

# --- demo_fast: the live-demo variant of video_flyover.yaml -----------------
# Same settings, but max_frames 60 instead of 250, so the full one-command
# run finishes in ~11 min on CPU instead of ~30-45 min. Measured end to end
# 2026-11-17 (run data/outputs/run_20261117_015145): keyframes + SfM 60/60
# registered, reproj 0.346 px, dense 960w/stride-2, mesh 3,362,335 verts,
# viewer.html generated; wall time 661.7 s. Use with --mesh so the viewer
# is produced. The 250-frame config is the fuller model; this is the demo.
